name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q run_main.py run_eval.py dlr_vot models layers data_provider data_provider_pretrain utils scripts
      - run: for file in scripts/*.sh; do bash -n "$file"; done
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/verify_reference_tables.py
